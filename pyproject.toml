[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-global-data"
version = "0.1.0"
description = "Public-source institutional data pipeline for Mesa Global NQ/MNQ analysis"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mesa-data = "mesa_global_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

